apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-router
spec:
  template:
    spec:
      containers:
        - name: router
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: inference-router-providers
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: inference-router-providers
                  key: ANTHROPIC_API_KEY
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: inference-router-providers
                  key: OPENROUTER_API_KEY
