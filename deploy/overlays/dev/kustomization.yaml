apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inference-router-dev
resources:
  - ../../base
  - secret-store.yaml
  - providers.yaml
patches:
  - path: router-provider-env.yaml
configMapGenerator:
  - name: inference-router-config
    literals:
      - ROUTER_MODE=eks
      - ROUTER_TIMEOUT_SECONDS=60
      - PROVIDER_TIMEOUT_SECONDS=25
      - CLASSIFIER_TIMEOUT_SECONDS=2
      - PYTHONDONTWRITEBYTECODE=1
images:
  - name: inference-router
    newName: 922763798103.dkr.ecr.us-west-2.amazonaws.com/inference-router
    digest: sha256:b5e6bae4a78d268e4547cd8d41d4b0f8dda609a5f8baab13c86facf4b30264dd
replicas:
  - name: inference-router
    count: 2
