apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-router
  labels:
    app.kubernetes.io/name: inference-router
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-router
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: inference-router
      containers:
        - name: router
          image: inference-router:unpromoted
          envFrom:
            - configMapRef:
                name: inference-router-config
            - secretRef:
                name: inference-router-providers
                optional: true
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
