apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-router
spec:
  replicas: 2
  progressDeadlineSeconds: 90
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: model-router
  template:
    metadata:
      labels:
        app: model-router
    spec:
      automountServiceAccountToken: false
      containers:
        - name: router
          image: model-router:lab-v1
          imagePullPolicy: Never
          env:
            - name: DEMO_PRIMARY_FAULT
              value: "none"
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: model-router
spec:
  selector:
    app: model-router
  ports:
    - port: 8080
      targetPort: http
