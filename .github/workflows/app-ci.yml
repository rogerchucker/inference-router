name: App CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - Dockerfile
      - app.py
      - providers.py
      - router.py
      - pyproject.toml
      - uv.lock
      - tests/**
      - .github/**
      - deploy/**
      - k8s/**
  workflow_dispatch:
    inputs:
      promote:
        description: Promote the current main commit through Dev and Stage
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Workflow concurrency cannot read changed files. CI-only main pushes share the queue while promotion is enabled.
  group: >-
    ${{ vars.PROMOTION_ENABLED == 'true' && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch'
        && inputs.promote && github.actor_id == '335912' && github.actor == github.triggering_actor))
      && 'app-promotion' || format('app-ci-{0}', github.run_id) }}
  queue: max

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tested-image: ${{ steps.tested-image.outputs.artifact-id }}
      python-version: ${{ steps.toolchain.outputs.python }}
      uv-version: ${{ steps.toolchain.outputs.uv }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select a promotion candidate
        id: candidate
        shell: bash
        env:
          PROMOTION_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.promote }}
          PROMOTION_ALLOWED: >-
            ${{ vars.PROMOTION_ENABLED == 'true' && github.ref == 'refs/heads/main'
              && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch'
                && inputs.promote && github.actor_id == '335912' && github.actor == github.triggering_actor)) }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [[ "$PROMOTION_ALLOWED" != true ]]; then
            if [[ "$PROMOTION_REQUESTED" == true ]]; then
              echo 'Promotion dispatch requires main, the repository owner, and PROMOTION_ENABLED=true.' >&2
              exit 1
            fi
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if git diff --quiet "$PUSH_BASE" HEAD -- .dockerignore Dockerfile app.py providers.py router.py pyproject.toml uv.lock; then
              exit 0
            else
              test "$?" = 1
            fi
          fi
          printf 'eligible=true\n' >> "$GITHUB_OUTPUT"
      - name: Read toolchain versions from Dockerfile
        id: toolchain
        shell: bash
        run: |
          python_version=$(sed -n 's/^ARG PYTHON_VERSION=//p' Dockerfile)
          uv_version=$(sed -n 's/^ARG UV_VERSION=//p' Dockerfile)
          if [[ ! "$python_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ||
                ! "$uv_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Dockerfile must declare one numeric Python version and one uv version.' >&2
            exit 1
          fi
          printf 'python=%s\nuv=%s\n' "$python_version" "$uv_version" >> "$GITHUB_OUTPUT"
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ steps.toolchain.outputs.uv }}
          python-version: ${{ steps.toolchain.outputs.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Test
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Test promotion logic
        run: uv run --with pyyaml==6.0.3 --locked python -m unittest discover -s .github/scripts -p 'test_delivery.py' -v
      - name: Build the router image for EKS
        run: docker build --platform linux/amd64 --provenance=false --sbom=false --tag inference-router:ci .
      - name: Smoke-test demo and EKS modes
        shell: bash
        run: |
          start_router() {
            container=$(docker run --platform linux/amd64 --detach -p 127.0.0.1::8080 "$@" inference-router:ci)
            address=$(docker port "$container" 8080/tcp)
            curl --fail --silent --show-error --retry 20 --retry-all-errors \
              --retry-delay 1 --max-time 2 "http://$address/readyz" |
              jq -e '.status == "ready"'
          }

          cleanup() {
            if [[ -n "${container:-}" ]]; then
              docker logs "$container" || true
              docker rm -f "$container" >/dev/null || true
            fi
          }
          response=$(mktemp)
          trap 'cleanup; rm -f "$response"' EXIT

          start_router -e DEMO_PRIMARY_FAULT=none
          curl --fail --silent --show-error --max-time 5 "http://$address/v1/infer" \
            -H 'Content-Type: application/json' -d '{"prompt":"CI smoke"}' |
            jq -e '.provider == "primary" and .attempts == 1 and (.text | length > 0)'
          cleanup
          container=

          start_router -e ROUTER_MODE=eks
          for payload in '{"prompt":"CI smoke"}' '{"prompt":"CI smoke","allow_cloud":false}'; do
            status=$(curl --silent --show-error --max-time 5 --output "$response" \
              --write-out '%{http_code}' "http://$address/v1/infer" \
              -H 'Content-Type: application/json' -d "$payload")
            test "$status" = 422
            jq -e '.detail == "local_inference_unavailable"' "$response"
          done
      - name: Check Kubernetes manifests and rollout
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base=${PUSH_BASE:-HEAD^1}
          if git diff --quiet "$base" HEAD -- deploy k8s; then
            exit 0
          else
            test "$?" = 1
          fi
          for overlay in deploy/overlays/*; do
            kubectl kustomize "$overlay" >/dev/null
          done
          trap 'kind delete cluster --name router-ci' EXIT
          kind create cluster --name router-ci --wait 90s
          docker tag inference-router:ci model-router:lab-v1
          kind load docker-image model-router:lab-v1 --name router-ci
          kubectl apply -f k8s/router.yaml
          kubectl rollout status deployment/model-router --timeout=120s
      - name: Save the tested image
        if: steps.candidate.outputs.eligible == 'true'
        run: docker save inference-router:ci -o "${RUNNER_TEMP}/inference-router.tar"
      - name: Upload the tested image
        if: steps.candidate.outputs.eligible == 'true'
        id: tested-image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inference-router.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish-image:
    if: >-
      ${{ vars.PROMOTION_ENABLED == 'true' && github.ref == 'refs/heads/main'
        && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch'
          && inputs.promote && github.actor_id == '335912' && github.actor == github.triggering_actor))
        && needs.verify.outputs.tested-image != '' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    env:
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Download the tested image from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.tested-image }}
          merge-multiple: true
          path: ${{ runner.temp }}/tested-image
      - name: Assume the image publishing role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.IMAGE_PUBLISH_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "922763798103"
      - name: Publish and record the immutable image digest
        id: publish
        shell: bash
        run: |
          : "${AWS_REGION:?Missing publishing AWS region}"
          registry="922763798103.dkr.ecr.${AWS_REGION}.amazonaws.com"
          test "$ECR_REPOSITORY_URL" = "$registry/inference-router"
          tagged_image="$ECR_REPOSITORY_URL:git-$GITHUB_SHA"
          image_manifest() {
            aws ecr batch-get-image --region "$AWS_REGION" --repository-name inference-router \
              --image-ids "imageTag=git-$GITHUB_SHA" --output json
          }

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$registry"
          trap 'docker logout "$registry" >/dev/null' EXIT
          docker load --input "$RUNNER_TEMP/tested-image/inference-router.tar"
          tested_id=$(docker image inspect --format '{{.Id}}' inference-router:ci)
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' inference-router:ci)" = linux/amd64
          manifest=$(image_manifest)
          if jq -e '(.images // []) == [] and ([.failures[]?.failureCode] == ["ImageNotFound"])' <<< "$manifest" >/dev/null; then
            docker tag inference-router:ci "$tagged_image"
            if ! docker push "$tagged_image"; then
              echo 'Checking ECR for the immutable tag after the push failed.' >&2
            fi
            manifest=$(image_manifest)
          fi
          if ! digest=$(jq -er 'select((.failures // []) == [] and (.images | length) == 1) | .images[0].imageId.imageDigest' <<< "$manifest"); then
            echo 'ECR did not return one image for this source tag.' >&2
            exit 1
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          config_digest=$(jq -er '.images[0].imageManifest | fromjson | .config.digest' <<< "$manifest")
          test "$config_digest" = "$tested_id"
          image="$ECR_REPOSITORY_URL@$digest"
          docker pull "$image"
          test "$(docker image inspect --format '{{.Id}}' "$image")" = "$tested_id"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'Published tested image `%s` from `%s`.\n' "$image" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  promote-dev:
    needs: [verify, publish-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.promote.outputs.revision }}
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ needs.verify.outputs.uv-version }}
          python-version: ${{ needs.verify.outputs.python-version }}
          enable-cache: false
      - name: Promote the candidate to dev
        id: promote
        shell: bash
        env:
          IMAGE: ${{ needs.publish-image.outputs.image }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          uv run --script .github/scripts/delivery.py promote --environment dev \
            --source "$GITHUB_SHA" --image "$IMAGE"

  verify-dev:
    needs: [verify, publish-image, promote-dev]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev-verify
    permissions:
      contents: read
      id-token: write
    outputs:
      evidence: ${{ steps.evidence.outputs.artifact-url }}
    env:
      IMAGE: ${{ needs.publish-image.outputs.image }}
      GITOPS_REVISION: ${{ needs.promote-dev.outputs.revision }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
      EKS_SESSION_HOST_ID: ${{ vars.EKS_SESSION_HOST_ID }}
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ needs.verify.outputs.uv-version }}
          python-version: ${{ needs.verify.outputs.python-version }}
          enable-cache: false
      - name: Install the Session Manager plugin
        run: bash .github/scripts/install-session-manager-plugin.sh
      - name: Assume the verification role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.VERIFICATION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "922763798103"
          role-session-name: promotion-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify the dev rollout and smoke tests
        id: smoke
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/dev-verification.txt"
          printf 'Source %s\nImage %s\nGitOps revision %s\n' "$GITHUB_SHA" "$IMAGE" "$GITOPS_REVISION" > "$evidence"
          uv run --script .github/scripts/verify-eks.py --environment dev \
            --image "$IMAGE" --revision "$GITOPS_REVISION" 2>&1 | tee -a "$evidence"
      - name: Preserve verification results
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' }}
        id: evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-verification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dev-verification.txt
          if-no-files-found: error
          retention-days: 90

  promote-staging:
    needs: [verify, publish-image, promote-dev, verify-dev]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.promote.outputs.revision }}
      previous-digest: ${{ steps.promote.outputs.previous_digest }}
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ needs.verify.outputs.uv-version }}
          python-version: ${{ needs.verify.outputs.python-version }}
          enable-cache: false
      - name: Promote the candidate to staging
        id: promote
        shell: bash
        env:
          IMAGE: ${{ needs.publish-image.outputs.image }}
          DEV_REVISION: ${{ needs.promote-dev.outputs.revision }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          uv run --script .github/scripts/delivery.py promote --environment staging \
            --source "$GITHUB_SHA" --image "$IMAGE" \
            --dev-revision "$DEV_REVISION"

  verify-staging:
    needs: [verify, publish-image, promote-staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging-verify
    permissions:
      contents: read
      id-token: write
    outputs:
      evidence: ${{ steps.evidence.outputs.artifact-url }}
    env:
      IMAGE: ${{ needs.publish-image.outputs.image }}
      GITOPS_REVISION: ${{ needs.promote-staging.outputs.revision }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
      EKS_SESSION_HOST_ID: ${{ vars.EKS_SESSION_HOST_ID }}
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ needs.verify.outputs.uv-version }}
          python-version: ${{ needs.verify.outputs.python-version }}
          enable-cache: false
      - name: Install the Session Manager plugin
        run: bash .github/scripts/install-session-manager-plugin.sh
      - name: Assume the verification role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.VERIFICATION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "922763798103"
          role-session-name: promotion-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify the staging rollout and smoke tests
        id: smoke
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/staging-verification.txt"
          printf 'Source %s\nImage %s\nGitOps revision %s\n' "$GITHUB_SHA" "$IMAGE" "$GITOPS_REVISION" > "$evidence"
          uv run --script .github/scripts/verify-eks.py --environment staging \
            --image "$IMAGE" --revision "$GITOPS_REVISION" 2>&1 | tee -a "$evidence"
      - name: Preserve verification results
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' }}
        id: evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-verification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-verification.txt
          if-no-files-found: error
          retention-days: 90

  release-staging:
    needs: [verify, publish-image, promote-dev, verify-dev, promote-staging, verify-staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ needs.verify.outputs.uv-version }}
          python-version: ${{ needs.verify.outputs.python-version }}
          enable-cache: false
      - name: Publish the verified Stage prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.publish-image.outputs.image }}
          DEV_REVISION: ${{ needs.promote-dev.outputs.revision }}
          DEV_EVIDENCE: ${{ needs.verify-dev.outputs.evidence }}
          STAGE_REVISION: ${{ needs.promote-staging.outputs.revision }}
          STAGE_EVIDENCE: ${{ needs.verify-staging.outputs.evidence }}
          PREVIOUS_STAGE_DIGEST: ${{ needs.promote-staging.outputs.previous-digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run --script .github/scripts/delivery.py release --source "$GITHUB_SHA" --image "$IMAGE" \
            --dev-revision "$DEV_REVISION" --stage-revision "$STAGE_REVISION" \
            --previous-digest "$PREVIOUS_STAGE_DIGEST" --run-url "$RUN_URL" \
            --dev-evidence "$DEV_EVIDENCE" --stage-evidence "$STAGE_EVIDENCE"
