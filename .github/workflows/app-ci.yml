name: App CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_staging:
        description: Publish the tested image to staging ECR
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read toolchain versions from Dockerfile
        id: toolchain
        shell: bash
        run: |
          python_version=$(sed -n 's/^ARG PYTHON_VERSION=//p' Dockerfile)
          uv_version=$(sed -n 's/^ARG UV_VERSION=//p' Dockerfile)
          if [[ ! "$python_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ||
                ! "$uv_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Dockerfile must declare one numeric Python version and one uv version.' >&2
            exit 1
          fi
          printf 'python=%s\nuv=%s\n' "$python_version" "$uv_version" >> "$GITHUB_OUTPUT"
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ steps.toolchain.outputs.uv }}
          python-version: ${{ steps.toolchain.outputs.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Test
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Build the router image
        run: docker build --tag inference-router:ci .
      - name: Smoke-test demo and EKS modes
        shell: bash
        run: |
          start_router() {
            container=$(docker run --detach -p 127.0.0.1::8080 "$@" inference-router:ci)
            address=$(docker port "$container" 8080/tcp)
            curl --fail --silent --show-error --retry 20 --retry-all-errors \
              --retry-delay 1 --max-time 2 "http://$address/readyz" |
              jq -e '.status == "ready"'
          }

          cleanup() {
            if [[ -n "${container:-}" ]]; then
              docker logs "$container" || true
              docker rm -f "$container" >/dev/null || true
            fi
          }
          response=$(mktemp)
          trap 'cleanup; rm -f "$response"' EXIT

          start_router -e DEMO_PRIMARY_FAULT=none
          curl --fail --silent --show-error --max-time 5 "http://$address/v1/infer" \
            -H 'Content-Type: application/json' -d '{"prompt":"CI smoke"}' |
            jq -e '.provider == "primary" and .attempts == 1 and (.text | length > 0)'
          cleanup
          container=

          start_router -e ROUTER_MODE=eks
          for payload in '{"prompt":"CI smoke"}' '{"prompt":"CI smoke","allow_cloud":false}'; do
            status=$(curl --silent --show-error --max-time 5 --output "$response" \
              --write-out '%{http_code}' "http://$address/v1/infer" \
              -H 'Content-Type: application/json' -d "$payload")
            test "$status" = 422
            jq -e '.detail == "local_inference_unavailable"' "$response"
          done
      - name: Save the tested image
        if: github.ref == 'refs/heads/main' && inputs.publish_staging
        run: docker save inference-router:ci -o "${RUNNER_TEMP}/inference-router.tar"
      - name: Upload the tested image
        if: github.ref == 'refs/heads/main' && inputs.publish_staging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-staging-image
          path: ${{ runner.temp }}/inference-router.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish-staging:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_staging
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging-publish
    permissions:
      contents: read
      id-token: write
    env:
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Download the tested image from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-staging-image
          path: ${{ runner.temp }}/staging-image
      - name: Assume the image publishing role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.IMAGE_PUBLISH_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "922763798103"
      - name: Publish and record the immutable image digest
        shell: bash
        run: |
          : "${ECR_REPOSITORY_URL:?Missing staging ECR repository URL}"
          : "${AWS_REGION:?Missing staging AWS region}"
          registry=${ECR_REPOSITORY_URL%%/*}
          tagged_image="$ECR_REPOSITORY_URL:git-$GITHUB_SHA"
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$registry"
          trap 'docker logout "$registry" >/dev/null' EXIT
          docker load --input "$RUNNER_TEMP/staging-image/inference-router.tar"
          if docker manifest inspect "$tagged_image" >/dev/null 2>&1; then
            docker pull "$tagged_image"
            test "$(docker inspect --format '{{.Id}}' "$tagged_image")" = "$(docker inspect --format '{{.Id}}' inference-router:ci)"
          else
            docker tag inference-router:ci "$tagged_image"
            docker push "$tagged_image"
          fi
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$tagged_image")
          digest=${image##*@}
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$image" = "$ECR_REPOSITORY_URL@$digest"
          printf 'Staging image `%s` built and tested from `%s`.\n' "$image" "$GITHUB_SHA" |
            tee -a "$GITHUB_STEP_SUMMARY"
