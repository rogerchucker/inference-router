name: Terraform CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "true"
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      - name: Initialize staging without a backend
        run: terraform -chdir=infra/environments/staging init -backend=false -input=false -lockfile=readonly
      - name: Validate staging
        run: terraform -chdir=infra/environments/staging validate
      - name: Initialize and validate the bootstrap root
        run: |
          terraform -chdir=infra/bootstrap/staging init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/bootstrap/staging validate
      - name: Initialize and validate the staging GitOps root
        run: |
          terraform -chdir=infra/environments/staging-gitops init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/environments/staging-gitops validate
      - name: Run module tests with a mocked AWS provider
        shell: bash
        run: |
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN \
            AWS_WEB_IDENTITY_TOKEN_FILE AWS_CONTAINER_CREDENTIALS_RELATIVE_URI \
            AWS_CONTAINER_CREDENTIALS_FULL_URI; do
            if [[ -n "${!name:-}" ]]; then
              echo "Unexpected AWS credential configuration: $name" >&2
              exit 1
            fi
          done
          terraform -chdir=infra/environments/staging test

  dev-and-promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "true"
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: Validate Dev and promotion access without a backend
        shell: bash
        run: |
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/terraform-plugins"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for root in infra/environments/{dev,dev-gitops,promotion-access} infra/bootstrap/dev; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
      - name: Test Dev infrastructure and approval settings with mocked providers
        run: |
          terraform -chdir=infra/environments/dev test
          terraform -chdir=infra/bootstrap/dev test
