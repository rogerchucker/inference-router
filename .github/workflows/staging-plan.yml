name: Staging Terraform

on:
  workflow_dispatch:
    inputs:
      approved_plan_sha256:
        description: "SHA-256 of the reviewed staging worker recovery plan. Leave blank for plan only."
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: terraform-staging
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    environment: staging-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      checksum: ${{ steps.review.outputs.checksum }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check staging recovery approval
        if: inputs.approved_plan_sha256 != ''
        shell: bash
        run: |
          # Bind this approval to the two remaining creates from the approved recovery and its Terraform source.
          test "$GITHUB_ACTOR_ID" = "335912"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$APPROVED_PLAN_SHA256" = "e100050fc7cd2f3cac4e1a3ad719a638dbf5e458cdc788f92ef97afd0ae9582f"
          test "$(git rev-parse HEAD:infra/environments/staging)" = "b8e274de04769b697485afecbc4b185a2911167e"
          test "$(git rev-parse HEAD:infra/modules/eks-control-plane)" = "13f04d1b44acafcdd8ba77f3abbf512a7e6785f1"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: Assume the staging plan role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "922763798103"
      - name: Initialize the locked staging backend
        shell: bash
        run: |
          : "${STATE_BUCKET:?Set TERRAFORM_STATE_BUCKET in staging-plan}"
          : "${AWS_REGION:?Set AWS_REGION in staging-plan}"
          terraform -chdir=infra/environments/staging init -input=false -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$AWS_REGION"
      - name: Generate a review summary
        id: review
        shell: bash
        run: |
          plan_dir=$(mktemp -d "$RUNNER_TEMP/staging-plan.XXXXXX")
          terraform -chdir=infra/environments/staging plan -input=false -no-color \
            -lock-timeout=60s -out="$plan_dir/staging.tfplan" > "$plan_dir/plan.txt"
          {
            printf '### Staging Terraform plan\n\nCommit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Plan SHA-256: `%s`\n\n' "$(sha256sum "$plan_dir/staging.tfplan" | cut -d ' ' -f 1)"
            printf '| Resource | Actions |\n| --- | --- |\n'
            terraform -chdir=infra/environments/staging show -json "$plan_dir/staging.tfplan" |
              jq -r '.resource_changes[]? | select(.change.actions != ["no-op"]) |
                "| `\(.address)` | \(.change.actions | join(", ")) |"'
            grep -E '^(Plan:|No changes\.)' "$plan_dir/plan.txt" || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ -n "$APPROVED_PLAN_SHA256" ]]; then
            terraform -chdir=infra/environments/staging show -json "$plan_dir/staging.tfplan" |
              jq -cS '[.resource_changes[] | {address,change:{actions:.change.actions,before:.change.before,after:.change.after,after_unknown:.change.after_unknown}}]|sort_by(.address)' \
                > "$plan_dir/changes.json"
            jq -e 'length > 0 and all(.[]; .change.actions == ["create"] or .change.actions == ["no-op"]) and ([.[] | select(.change.actions == ["create"])] | length) == 2' \
              "$plan_dir/changes.json"
            changes_checksum=$(sha256sum "$plan_dir/changes.json" | cut -d ' ' -f 1)
            if [[ "$changes_checksum" != "ba62740c3cd7170b17c6e2a391dc36392dfd071562f5e91ddddc0be129554ecf" ]]; then
              echo "The fresh plan differs from the reviewed plan. Apply is blocked." >&2
              exit 1
            fi
            echo "Both remaining creates and their values match the reviewed plan."
            checksum=$(sha256sum "$plan_dir/staging.tfplan" | cut -d ' ' -f 1)
            printf 'checksum=%s\nfile=%s\n' "$checksum" "$plan_dir/staging.tfplan" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the approved plan for this run
        if: inputs.approved_plan_sha256 != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approved-staging-plan
          path: ${{ steps.review.outputs.file }}
          if-no-files-found: error
          retention-days: 1

  apply:
    if: github.ref == 'refs/heads/main' && github.actor_id == '335912' && github.run_attempt == '1' && inputs.approved_plan_sha256 != '' && needs.plan.outputs.checksum != ''
    needs: plan
    environment: staging-apply
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: Download the saved plan from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approved-staging-plan
          path: ${{ runner.temp }}/approved-staging
      - name: Verify the saved plan checksum
        shell: bash
        env:
          APPROVED_CHECKSUM: ${{ needs.plan.outputs.checksum }}
        run: |
          [[ "$APPROVED_CHECKSUM" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$APPROVED_CHECKSUM" "$RUNNER_TEMP/approved-staging/staging.tfplan" |
            sha256sum --check
      - name: Assume the staging apply role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "922763798103"
      - name: Initialize the locked staging backend
        shell: bash
        run: |
          terraform -chdir=infra/environments/staging init -input=false -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$AWS_REGION"
      - name: Apply the verified plan
        shell: bash
        run: |
          terraform -chdir=infra/environments/staging apply -input=false \
            -no-color -lock-timeout=60s "$RUNNER_TEMP/approved-staging/staging.tfplan"
